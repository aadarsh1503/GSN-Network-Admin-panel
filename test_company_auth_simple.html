<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Company Authentication</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .info { background-color: #d1ecf1; color: #0c5460; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Company Authentication Test</h1>
    
    <div>
        <button onclick="checkLocalStorage()">Check Local Storage</button>
        <button onclick="testAvailableQuotes()">Test Available Quotes API</button>
        <button onclick="testOtherAPI()">Test Other Company API</button>
        <button onclick="clearStorage()">Clear Storage</button>
    </div>
    
    <div id="results"></div>

    <script>
        function addResult(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = message;
            results.appendChild(div);
        }

        function checkLocalStorage() {
            document.getElementById('results').innerHTML = '';
            
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');
            
            addResult('<h3>Local Storage Check</h3>');
            addResult(`Token exists: ${!!token}`, token ? 'success' : 'error');
            addResult(`User exists: ${!!user}`, user ? 'success' : 'error');
            
            if (token) {
                try {
                    const payload = JSON.parse(atob(token.split('.')[1]));
                    const currentTime = Date.now() / 1000;
                    const isExpired = payload.exp < currentTime;
                    
                    addResult(`<pre>Token Info:
ID: ${payload.id}
Role: ${payload.role}
Expires: ${new Date(payload.exp * 1000).toISOString()}
Is Expired: ${isExpired}</pre>`, isExpired ? 'error' : 'success');
                } catch (e) {
                    addResult(`Error decoding token: ${e.message}`, 'error');
                }
            }
            
            if (user) {
                try {
                    const userData = JSON.parse(user);
                    addResult(`<pre>User Info:
ID: ${userData.id}
Role: ${userData.role}
Email: ${userData.email}</pre>`, 'info');
                } catch (e) {
                    addResult(`Error parsing user: ${e.message}`, 'error');
                }
            }
        }

        async function testAvailableQuotes() {
            const token = localStorage.getItem('token');
            
            if (!token) {
                addResult('No token found! Please login first.', 'error');
                return;
            }
            
            addResult('<h3>Testing Available Quotes API</h3>');
            
            try {
                const response = await fetch('http://localhost:5000/api/quotes/available', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                        'Cache-Control': 'no-cache, no-store, must-revalidate',
                        'Pragma': 'no-cache',
                        'Expires': '0'
                    }
                });

                addResult(`Response Status: ${response.status}`, response.ok ? 'success' : 'error');
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    addResult(`<pre>Error Response: ${JSON.stringify(errorData, null, 2)}</pre>`, 'error');
                } else {
                    const data = await response.json();
                    addResult(`<pre>Success Response:
Quotes Count: ${data.quotes?.length || 0}
Has Active Subscription: ${data.hasActiveSubscription}
Can Respond: ${data.canRespond}
Total Quotes: ${data.totalQuotes}
Local Quotes: ${data.localQuotes}</pre>`, 'success');
                }
            } catch (error) {
                addResult(`Network Error: ${error.message}`, 'error');
            }
        }

        async function testOtherAPI() {
            const token = localStorage.getItem('token');
            
            if (!token) {
                addResult('No token found! Please login first.', 'error');
                return;
            }
            
            addResult('<h3>Testing Other Company API (Dashboard Stats)</h3>');
            
            try {
                const response = await fetch('http://localhost:5000/api/dashboard/company-stats', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });

                addResult(`Response Status: ${response.status}`, response.ok ? 'success' : 'error');
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    addResult(`<pre>Error Response: ${JSON.stringify(errorData, null, 2)}</pre>`, 'error');
                } else {
                    const data = await response.json();
                    addResult(`<pre>Dashboard API Success:
Available Quotes: ${data.availableQuotes}
Messages: ${JSON.stringify(data.messages)}
Responses: ${JSON.stringify(data.responses)}</pre>`, 'success');
                }
            } catch (error) {
                addResult(`Network Error: ${error.message}`, 'error');
            }
        }

        function clearStorage() {
            localStorage.clear();
            addResult('Local storage cleared. Please refresh and login again.', 'info');
        }

        // Auto-run check on page load
        window.onload = function() {
            checkLocalStorage();
        };
    </script>
</body>
</html>

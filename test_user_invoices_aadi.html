<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test User Invoices - Aadi</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 10px 0; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .invoice { border: 1px solid #ddd; margin: 10px 0; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Test User Invoices API - Aadi</h1>
    
    <div>
        <h3>Login as User</h3>
        <input type="email" id="email" placeholder="Email" value="aadi@gmail.com">
        <input type="password" id="password" placeholder="Password" value="222333">
        <button onclick="login()">Login</button>
    </div>
    
    <div>
        <h3>Test User Invoices API</h3>
        <button onclick="testUserInvoices()">Get User Transaction Invoices</button>
        <button onclick="testInvoiceDetails()">Get Invoice Details (ID: 7)</button>
    </div>
    
    <div id="results"></div>

    <script>
        let authToken = localStorage.getItem('token');
        
        function addResult(title, content, isError = false) {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `result ${isError ? 'error' : 'success'}`;
            div.innerHTML = `<h4>${title}</h4><pre>${content}</pre>`;
            results.appendChild(div);
        }
        
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    authToken = data.token;
                    localStorage.setItem('token', authToken);
                    addResult('Login Success', `User: ${data.user.name} (${data.user.email})
Role: ${data.user.role}
ID: ${data.user.id}`);
                } else {
                    addResult('Login Failed', JSON.stringify(data, null, 2), true);
                }
            } catch (error) {
                addResult('Login Error', error.message, true);
            }
        }
        
        async function testUserInvoices() {
            if (!authToken) {
                addResult('Error', 'Please login first', true);
                return;
            }
            
            try {
                const response = await fetch('http://localhost:5000/api/user/transaction-invoices', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    let content = `Status: ${response.status}
Count: ${Array.isArray(data) ? data.length : 'Not an array'}

`;
                    if (Array.isArray(data) && data.length > 0) {
                        content += 'Invoices:\n';
                        data.forEach((inv, idx) => {
                            content += `${idx + 1}. ${inv.invoice_number}: $${inv.total_amount}
   Quote: ${inv.departure_city} → ${inv.arrival_city}
   Company: ${inv.company_name}
   Status: ${inv.status}
   Date: ${new Date(inv.created_at).toLocaleDateString()}

`;
                        });
                    }
                    addResult('User Invoices Success ✅', content);
                } else {
                    addResult('User Invoices Failed', `Status: ${response.status}
Error: ${JSON.stringify(data, null, 2)}`, true);
                }
            } catch (error) {
                addResult('User Invoices Error', error.message, true);
            }
        }
        
        async function testInvoiceDetails() {
            if (!authToken) {
                addResult('Error', 'Please login first', true);
                return;
            }
            
            try {
                const response = await fetch('http://localhost:5000/api/user/transaction-invoices/7', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    let content = `Status: ${response.status}
Invoice Details:
- Invoice #: ${data.invoice_number}
- Quote ID: ${data.quote_id}
- Amount: $${data.total_amount}
- Status: ${data.status}
- Company: ${data.company_name} (${data.company_email})
- Route: ${data.departure_city} → ${data.arrival_city}
- Product: ${data.product_description}
- Date: ${new Date(data.created_at).toLocaleDateString()}

Full Data:
${JSON.stringify(data, null, 2)}`;
                    addResult('Invoice Details Success ✅', content);
                } else {
                    addResult('Invoice Details Failed', `Status: ${response.status}
Error: ${JSON.stringify(data, null, 2)}`, true);
                }
            } catch (error) {
                addResult('Invoice Details Error', error.message, true);
            }
        }
        
        // Auto-login if token exists
        if (authToken) {
            addResult('Token Found', `Using existing token`);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Quotes Debug - Detailed</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background-color: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .info { background-color: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }
        .warning { background-color: #fff3cd; border: 1px solid #ffeaa7; color: #856404; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 5px; overflow-x: auto; font-size: 12px; }
        button { padding: 10px 20px; margin: 5px; border: none; border-radius: 5px; cursor: pointer; background-color: #007bff; color: white; }
        .step { border-left: 4px solid #007bff; padding-left: 10px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>🔍 Member Quotes Debug - Detailed Analysis</h1>
    
    <div class="result info">
        <h3>This will simulate the exact same flow as MemberQuotesPage.jsx</h3>
        <p>Make sure you're logged in to your application first!</p>
    </div>
    
    <button onclick="runDetailedDebug()">🚀 Run Detailed Debug</button>
    <button onclick="clearResults()">🗑️ Clear Results</button>
    
    <div id="results"></div>

    <script>
        function addResult(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = message;
            results.appendChild(div);
            results.scrollTop = results.scrollHeight;
        }

        function addStep(stepNumber, message) {
            addResult(`<div class="step"><strong>Step ${stepNumber}:</strong> ${message}</div>`, 'info');
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        // Simulate the exact same token validation logic as MemberQuotesPage
        function validateToken(token) {
            if (!token) {
                return { valid: false, reason: 'No token found' };
            }

            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                const currentTime = Date.now() / 1000;
                
                if (payload.exp < currentTime) {
                    return { 
                        valid: false, 
                        reason: 'Token expired',
                        details: {
                            expired: new Date(payload.exp * 1000).toLocaleString(),
                            current: new Date().toLocaleString(),
                            user: payload.email
                        }
                    };
                }
                
                return { 
                    valid: true, 
                    payload: payload,
                    details: {
                        user: payload.email,
                        role: payload.role,
                        expires: new Date(payload.exp * 1000).toLocaleString()
                    }
                };
                
            } catch (error) {
                return { 
                    valid: false, 
                    reason: 'Invalid token format',
                    error: error.message 
                };
            }
        }

        // Simulate the exact same API request logic
        async function simulateApiRequest(token) {
            const headers = {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json',
                'Cache-Control': 'no-cache, no-store, must-revalidate',
                'Pragma': 'no-cache',
                'Expires': '0'
            };

            try {
                const response = await fetch('http://localhost:5000/api/quotes/available', {
                    method: 'GET',
                    headers: headers
                });

                return {
                    success: response.ok,
                    status: response.status,
                    statusText: response.statusText,
                    data: response.ok ? await response.json() : await response.text()
                };

            } catch (error) {
                return {
                    success: false,
                    error: error.message
                };
            }
        }

        async function runDetailedDebug() {
            clearResults();
            addResult('<h2>🔍 Starting Detailed Debug Analysis</h2>', 'info');
            
            // Step 1: Check localStorage
            addStep(1, 'Checking localStorage for token and user data');
            
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');
            
            addResult(`Token exists: ${token ? '✅ YES' : '❌ NO'}`, token ? 'success' : 'error');
            addResult(`User data exists: ${user ? '✅ YES' : '❌ NO'}`, user ? 'success' : 'error');
            
            if (!token) {
                addResult('❌ STOP: No token found. Please login first.', 'error');
                return;
            }
            
            // Step 2: Validate token format and expiration
            addStep(2, 'Validating token format and expiration');
            
            const tokenValidation = validateToken(token);
            
            if (!tokenValidation.valid) {
                addResult(`❌ Token validation failed: ${tokenValidation.reason}`, 'error');
                if (tokenValidation.details) {
                    addResult(`<pre>${JSON.stringify(tokenValidation.details, null, 2)}</pre>`, 'error');
                }
                if (tokenValidation.error) {
                    addResult(`Error details: ${tokenValidation.error}`, 'error');
                }
                return;
            }
            
            addResult('✅ Token validation passed', 'success');
            addResult(`<pre>Token Details:
${JSON.stringify(tokenValidation.details, null, 2)}</pre>`, 'info');
            
            // Step 3: Check user role
            addStep(3, 'Checking user role');
            
            if (user) {
                try {
                    const userData = JSON.parse(user);
                    addResult(`User role: ${userData.role}`, 'info');
                    
                    if (userData.role !== 'company') {
                        addResult('❌ STOP: User role is not "company"', 'error');
                        return;
                    }
                    
                    addResult('✅ User role validation passed', 'success');
                    
                } catch (e) {
                    addResult(`❌ Error parsing user data: ${e.message}`, 'error');
                    return;
                }
            } else {
                addResult('⚠️ No user data found, but token exists', 'warning');
            }
            
            // Step 4: Make API request
            addStep(4, 'Making API request to /api/quotes/available');
            
            addResult('📤 Sending request with headers:', 'info');
            addResult(`<pre>Authorization: Bearer ${token.substring(0, 30)}...
Content-Type: application/json
Cache-Control: no-cache, no-store, must-revalidate
Pragma: no-cache
Expires: 0</pre>`, 'info');
            
            const apiResult = await simulateApiRequest(token);
            
            // Step 5: Analyze API response
            addStep(5, 'Analyzing API response');
            
            if (apiResult.success) {
                addResult(`✅ API request successful! Status: ${apiResult.status}`, 'success');
                addResult(`📊 Received ${apiResult.data.quotes?.length || 0} quotes`, 'success');
                
                if (apiResult.data.quotes && apiResult.data.quotes.length > 0) {
                    addResult(`<pre>Sample quote data:
${JSON.stringify(apiResult.data.quotes[0], null, 2)}</pre>`, 'info');
                }
                
            } else {
                addResult(`❌ API request failed! Status: ${apiResult.status || 'Network Error'}`, 'error');
                addResult(`Error: ${apiResult.error || apiResult.data}`, 'error');
                
                // Additional debugging for 401 errors
                if (apiResult.status === 401) {
                    addResult('<h4>🔍 401 Unauthorized Analysis:</h4>', 'warning');
                    addResult('This means the server rejected the token. Possible causes:', 'warning');
                    addResult('• Token format is incorrect', 'warning');
                    addResult('• Token signature is invalid', 'warning');
                    addResult('• Server JWT_SECRET is different', 'warning');
                    addResult('• Token was issued by a different server', 'warning');
                    
                    // Let's try to decode the token and see what's in it
                    try {
                        const parts = token.split('.');
                        const header = JSON.parse(atob(parts[0]));
                        const payload = JSON.parse(atob(parts[1]));
                        
                        addResult(`<pre>Token Header:
${JSON.stringify(header, null, 2)}

Token Payload:
${JSON.stringify(payload, null, 2)}</pre>`, 'info');
                        
                    } catch (decodeError) {
                        addResult(`❌ Could not decode token: ${decodeError.message}`, 'error');
                    }
                }
            }
            
            // Step 6: Summary
            addStep(6, 'Summary and Recommendations');
            
            if (apiResult.success) {
                addResult('🎉 Everything is working correctly! The issue might be intermittent or browser-specific.', 'success');
                addResult('Try refreshing your main application page.', 'info');
            } else {
                addResult('❌ Issue confirmed. Recommendations:', 'error');
                addResult('1. Try logging out and logging back in', 'warning');
                addResult('2. Clear browser cache and localStorage', 'warning');
                addResult('3. Check if server is running and accessible', 'warning');
                addResult('4. Verify JWT_SECRET matches between client and server', 'warning');
            }
        }

        // Auto-run on page load
        window.onload = function() {
            addResult('🚀 Debug page loaded. Click "Run Detailed Debug" to start analysis.', 'info');
        };
    </script>
</body>
</html>

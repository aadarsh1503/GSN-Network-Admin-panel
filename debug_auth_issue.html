<!DOCTYPE html>
<html>
<head>
    <title>Debug Authentication Issue</title>
</head>
<body>
    <h1>Debug Authentication Issue</h1>
    <div id="results"></div>
    
    <script>
        async function debugAuth() {
            const results = document.getElementById('results');
            
            // Check if token exists
            const token = localStorage.getItem('token');
            results.innerHTML += `<p><strong>Token exists:</strong> ${token ? 'Yes' : 'No'}</p>`;
            
            if (token) {
                results.innerHTML += `<p><strong>Token:</strong> ${token.substring(0, 50)}...</p>`;
                
                // Check if token is expired
                try {
                    const payload = JSON.parse(atob(token.split('.')[1]));
                    const currentTime = Date.now() / 1000;
                    const isExpired = payload.exp < currentTime;
                    results.innerHTML += `<p><strong>Token expired:</strong> ${isExpired ? 'Yes' : 'No'}</p>`;
                    results.innerHTML += `<p><strong>Token expires at:</strong> ${new Date(payload.exp * 1000)}</p>`;
                    results.innerHTML += `<p><strong>Current time:</strong> ${new Date()}</p>`;
                    results.innerHTML += `<p><strong>User ID:</strong> ${payload.id}</p>`;
                    results.innerHTML += `<p><strong>User role:</strong> ${payload.role}</p>`;
                } catch (error) {
                    results.innerHTML += `<p><strong>Token parse error:</strong> ${error.message}</p>`;
                }
            }
            
            // Test API call
            if (token) {
                try {
                    results.innerHTML += `<p><strong>Testing API call...</strong></p>`;
                    
                    const response = await fetch('http://localhost:5000/api/quotes/available', {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    
                    results.innerHTML += `<p><strong>Response status:</strong> ${response.status}</p>`;
                    results.innerHTML += `<p><strong>Response ok:</strong> ${response.ok}</p>`;
                    
                    const data = await response.text();
                    results.innerHTML += `<p><strong>Response data:</strong> ${data.substring(0, 200)}...</p>`;
                    
                } catch (error) {
                    results.innerHTML += `<p><strong>API call error:</strong> ${error.message}</p>`;
                }
            }
        }
        
        // Run debug on page load
        debugAuth();
    </script>
</body>
</html>

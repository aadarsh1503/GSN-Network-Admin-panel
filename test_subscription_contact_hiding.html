<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Subscription Contact Hiding</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .result { margin-top: 10px; padding: 10px; background: #f8f9fa; border-radius: 4px; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔒 Subscription Contact Hiding Test</h1>
    <p>This test verifies that contact information is properly hidden for companies with basic plans or exhausted response limits.</p>

    <div class="test-section info">
        <h3>Test Scenarios</h3>
        <button onclick="testBasicPlan()">Test Basic Plan (0 responses)</button>
        <button onclick="testExhaustedPlan()">Test Exhausted Plan (used all responses)</button>
        <button onclick="testValidPlan()">Test Valid Plan (has responses left)</button>
        <button onclick="testUnlimitedPlan()">Test Unlimited Plan</button>
    </div>

    <div id="results"></div>

    <script>
        const API_BASE = 'http://localhost:5000/api';
        
        // Get auth token from localStorage
        function getAuthToken() {
            return localStorage.getItem('token') || localStorage.getItem('authToken');
        }

        async function makeRequest(url, options = {}) {
            const token = getAuthToken();
            if (!token) {
                throw new Error('No authentication token found. Please log in first.');
            }

            const response = await fetch(url, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`,
                    ...options.headers
                }
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`HTTP ${response.status}: ${errorText}`);
            }

            return response.json();
        }

        function displayResult(title, data, isSuccess = true) {
            const resultsDiv = document.getElementById('results');
            const resultDiv = document.createElement('div');
            resultDiv.className = `test-section ${isSuccess ? 'success' : 'error'}`;
            
            resultDiv.innerHTML = `
                <h3>${title}</h3>
                <div class="result">
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                </div>
            `;
            
            resultsDiv.appendChild(resultDiv);
        }

        function displayError(title, error) {
            displayResult(`❌ ${title}`, { error: error.message }, false);
        }

        async function testBasicPlan() {
            try {
                console.log('🧪 Testing Basic Plan (0 responses)...');
                
                // This test assumes the current user has a basic plan
                // In a real scenario, you'd need to set up test data
                const data = await makeRequest(`${API_BASE}/quotes/available`);
                
                // Check if contact information is hidden
                const hasHiddenContact = data.quotes.some(quote => 
                    quote.user_name?.includes('[Contact info hidden') ||
                    quote.user_email?.includes('[Contact info hidden') ||
                    quote.user_phone?.includes('[Contact info hidden')
                );

                const subscriptionInfo = data.subscription;
                const expectedHidden = subscriptionInfo && (
                    subscriptionInfo.maxResponses === 0 || 
                    !subscriptionInfo.canSeeContactInfo
                );

                displayResult(
                    `✅ Basic Plan Test - Contact Info ${expectedHidden ? 'Hidden' : 'Visible'}`,
                    {
                        subscription: subscriptionInfo,
                        contactInfoHidden: hasHiddenContact,
                        expectedHidden: expectedHidden,
                        testPassed: hasHiddenContact === expectedHidden,
                        sampleQuote: data.quotes[0] ? {
                            user_name: data.quotes[0].user_name,
                            user_email: data.quotes[0].user_email,
                            user_phone: data.quotes[0].user_phone
                        } : 'No quotes available'
                    },
                    hasHiddenContact === expectedHidden
                );

            } catch (error) {
                displayError('Basic Plan Test', error);
            }
        }

        async function testExhaustedPlan() {
            try {
                console.log('🧪 Testing Exhausted Plan...');
                
                const data = await makeRequest(`${API_BASE}/quotes/available`);
                
                const subscriptionInfo = data.subscription;
                const isExhausted = subscriptionInfo && 
                    subscriptionInfo.maxResponses !== -1 && 
                    subscriptionInfo.currentResponses >= subscriptionInfo.maxResponses;

                const hasHiddenContact = data.quotes.some(quote => 
                    quote.user_name?.includes('[Contact info hidden') ||
                    quote.user_email?.includes('[Contact info hidden')
                );

                displayResult(
                    `✅ Exhausted Plan Test - ${isExhausted ? 'Should Hide' : 'Should Show'} Contact Info`,
                    {
                        subscription: subscriptionInfo,
                        isExhausted: isExhausted,
                        contactInfoHidden: hasHiddenContact,
                        canRespond: data.canRespond,
                        testPassed: isExhausted ? hasHiddenContact : !hasHiddenContact
                    },
                    isExhausted ? hasHiddenContact : !hasHiddenContact
                );

            } catch (error) {
                displayError('Exhausted Plan Test', error);
            }
        }

        async function testValidPlan() {
            try {
                console.log('🧪 Testing Valid Plan (has responses left)...');
                
                const data = await makeRequest(`${API_BASE}/quotes/available`);
                
                const subscriptionInfo = data.subscription;
                const hasResponsesLeft = subscriptionInfo && (
                    subscriptionInfo.maxResponses === -1 || 
                    subscriptionInfo.currentResponses < subscriptionInfo.maxResponses
                );

                const hasVisibleContact = data.quotes.some(quote => 
                    quote.user_name && !quote.user_name.includes('[Contact info hidden') &&
                    quote.user_email && !quote.user_email.includes('[Contact info hidden')
                );

                displayResult(
                    `✅ Valid Plan Test - ${hasResponsesLeft ? 'Should Show' : 'Should Hide'} Contact Info`,
                    {
                        subscription: subscriptionInfo,
                        hasResponsesLeft: hasResponsesLeft,
                        contactInfoVisible: hasVisibleContact,
                        canRespond: data.canRespond,
                        testPassed: hasResponsesLeft ? hasVisibleContact : !hasVisibleContact
                    },
                    hasResponsesLeft ? hasVisibleContact : !hasVisibleContact
                );

            } catch (error) {
                displayError('Valid Plan Test', error);
            }
        }

        async function testUnlimitedPlan() {
            try {
                console.log('🧪 Testing Unlimited Plan...');
                
                const data = await makeRequest(`${API_BASE}/quotes/available`);
                
                const subscriptionInfo = data.subscription;
                const isUnlimited = subscriptionInfo && subscriptionInfo.maxResponses === -1;

                const hasVisibleContact = data.quotes.some(quote => 
                    quote.user_name && !quote.user_name.includes('[Contact info hidden') &&
                    quote.user_email && !quote.user_email.includes('[Contact info hidden')
                );

                displayResult(
                    `✅ Unlimited Plan Test - Should Always Show Contact Info`,
                    {
                        subscription: subscriptionInfo,
                        isUnlimited: isUnlimited,
                        contactInfoVisible: hasVisibleContact,
                        canRespond: data.canRespond,
                        testPassed: isUnlimited ? hasVisibleContact : true // If not unlimited, test doesn't apply
                    },
                    isUnlimited ? hasVisibleContact : true
                );

            } catch (error) {
                displayError('Unlimited Plan Test', error);
            }
        }

        // Auto-run basic test on page load
        window.onload = function() {
            const token = getAuthToken();
            if (!token) {
                displayError('Authentication', new Error('Please log in to your company account first, then refresh this page.'));
            } else {
                displayResult('🔑 Authentication Status', { 
                    tokenFound: true, 
                    tokenPreview: token.substring(0, 20) + '...' 
                }, true);
            }
        };
    </script>
</body>
</html>

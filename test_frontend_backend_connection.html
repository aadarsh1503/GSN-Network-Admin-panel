<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend-Backend Connection Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .info { background-color: #d1ecf1; color: #0c5460; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        #fileInput { margin: 10px 0; }
        #results { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Frontend-Backend Connection Test</h1>
    
    <div>
        <h3>1. Test Basic Connection</h3>
        <button onclick="testConnection()">Test Connection</button>
    </div>
    
    <div>
        <h3>2. Test Login</h3>
        <button onclick="testLogin()">Test Business Login</button>
    </div>
    
    <div>
        <h3>3. Test File Upload</h3>
        <input type="file" id="fileInput" accept="image/*">
        <button onclick="testFileUpload()">Test File Upload</button>
    </div>
    
    <div>
        <h3>4. Test Complete Flow</h3>
        <button onclick="testCompleteFlow()">Test Dispute Creation with File</button>
    </div>
    
    <div id="results"></div>

    <script>
        const API_BASE = 'http://localhost:5000';
        let authToken = null;
        
        function addResult(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            results.appendChild(div);
            console.log(message);
        }
        
        async function testConnection() {
            try {
                addResult('Testing basic connection to backend...', 'info');
                
                // Try a simple endpoint that should exist
                const response = await fetch(`${API_BASE}/api/disputes/reasons`);
                
                if (response.ok) {
                    const data = await response.json();
                    addResult(`✅ Connection successful! Found ${data.length} dispute reasons`, 'success');
                } else {
                    addResult(`❌ Connection failed: ${response.status} ${response.statusText}`, 'error');
                }
            } catch (error) {
                addResult(`❌ Connection error: ${error.message}`, 'error');
            }
        }
        
        async function testLogin() {
            try {
                addResult('Testing business user login...', 'info');
                
                const response = await fetch(`${API_BASE}/api/user/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'a@gmail.com',
                        password: '222333'
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    authToken = data.token;
                    addResult(`✅ Login successful! User: ${data.user.name} (${data.user.role})`, 'success');
                } else {
                    const errorData = await response.json();
                    addResult(`❌ Login failed: ${errorData.message}`, 'error');
                }
            } catch (error) {
                addResult(`❌ Login error: ${error.message}`, 'error');
            }
        }
        
        async function testFileUpload() {
            if (!authToken) {
                addResult('❌ Please login first', 'error');
                return;
            }
            
            const fileInput = document.getElementById('fileInput');
            if (!fileInput.files[0]) {
                addResult('❌ Please select a file first', 'error');
                return;
            }
            
            try {
                addResult('Testing file upload...', 'info');
                
                const formData = new FormData();
                formData.append('image', fileInput.files[0]);
                
                const response = await fetch(`${API_BASE}/api/upload/image`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: formData
                });
                
                if (response.ok) {
                    const data = await response.json();
                    addResult(`✅ File upload successful! URL: ${data.url}`, 'success');
                } else {
                    const errorData = await response.json();
                    addResult(`❌ File upload failed: ${errorData.message}`, 'error');
                }
            } catch (error) {
                addResult(`❌ File upload error: ${error.message}`, 'error');
            }
        }
        
        async function testCompleteFlow() {
            if (!authToken) {
                addResult('❌ Please login first', 'error');
                return;
            }
            
            try {
                addResult('Testing complete dispute creation flow...', 'info');
                
                // 1. Create dispute
                const disputeData = {
                    company_id: 10,
                    dispute_reason_id: 1,
                    title: 'Frontend Test Dispute',
                    description: 'Testing from HTML page',
                    priority: 'medium'
                };
                
                const disputeResponse = await fetch(`${API_BASE}/api/disputes/create`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify(disputeData)
                });
                
                if (!disputeResponse.ok) {
                    const errorData = await disputeResponse.json();
                    addResult(`❌ Dispute creation failed: ${errorData.message}`, 'error');
                    return;
                }
                
                const disputeResult = await disputeResponse.json();
                addResult(`✅ Dispute created successfully! ID: ${disputeResult.disputeId}`, 'success');
                
                // 2. Upload file if selected
                const fileInput = document.getElementById('fileInput');
                if (fileInput.files[0]) {
                    const formData = new FormData();
                    formData.append('image', fileInput.files[0]);
                    
                    const uploadResponse = await fetch(`${API_BASE}/api/upload/image`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${authToken}`
                        },
                        body: formData
                    });
                    
                    if (uploadResponse.ok) {
                        const uploadResult = await uploadResponse.json();
                        addResult(`✅ File uploaded successfully!`, 'success');
                        
                        // 3. Attach to dispute
                        const attachmentResponse = await fetch(`${API_BASE}/api/disputes/attachments`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${authToken}`
                            },
                            body: JSON.stringify({
                                dispute_id: disputeResult.disputeId,
                                image_url: uploadResult.url,
                                image_type: 'evidence'
                            })
                        });
                        
                        if (attachmentResponse.ok) {
                            addResult(`✅ Complete flow successful! Dispute with attachment created.`, 'success');
                        } else {
                            const attachError = await attachmentResponse.json();
                            addResult(`❌ Attachment failed: ${attachError.message}`, 'error');
                        }
                    } else {
                        const uploadError = await uploadResponse.json();
                        addResult(`❌ File upload failed: ${uploadError.message}`, 'error');
                    }
                } else {
                    addResult(`✅ Dispute created without attachment`, 'success');
                }
                
            } catch (error) {
                addResult(`❌ Complete flow error: ${error.message}`, 'error');
            }
        }
    </script>
</body>
</html>

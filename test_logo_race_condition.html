<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Race Condition Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }
        .test-section {
            background: #f9f9f9;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            border-left: 4px solid #007bff;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #0056b3; }
        .result {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 4px;
            white-space: pre-wrap;
            font-family: monospace;
        }
        .success { border-left: 4px solid green; }
        .error { border-left: 4px solid red; }
        .warning { border-left: 4px solid orange; }
    </style>
</head>
<body>
    <h1>🧪 Logo Race Condition Test</h1>
    <p>This test simulates the race condition that might be causing the logo to disappear.</p>

    <div class="test-section">
        <h3>Step 1: Login</h3>
        <input type="email" id="email" placeholder="Email" value="aadi@gmail.com" style="width: 200px; padding: 8px;">
        <input type="password" id="password" placeholder="Password" value="123456" style="width: 200px; padding: 8px;">
        <button onclick="login()">Login</button>
        <div id="loginResult" class="result"></div>
    </div>

    <div class="test-section">
        <h3>Step 2: Get Initial Profile</h3>
        <button onclick="getProfile('initial')">Get Profile</button>
        <div id="initialProfile" class="result"></div>
    </div>

    <div class="test-section">
        <h3>Step 3: Simulate Logo Upload</h3>
        <button onclick="simulateLogoUpload()">Simulate Logo Upload</button>
        <div id="logoUploadResult" class="result"></div>
    </div>

    <div class="test-section">
        <h3>Step 4: Simulate Profile Save (without logo)</h3>
        <button onclick="simulateProfileSave()">Simulate Profile Save</button>
        <div id="profileSaveResult" class="result"></div>
    </div>

    <div class="test-section">
        <h3>Step 5: Check Final Profile</h3>
        <button onclick="getProfile('final')">Get Final Profile</button>
        <div id="finalProfile" class="result"></div>
    </div>

    <div class="test-section">
        <h3>Step 6: Test Concurrent Calls</h3>
        <button onclick="testConcurrentCalls()">Test Concurrent Profile Updates</button>
        <div id="concurrentResult" class="result"></div>
    </div>

    <script>
        let token = '';
        let currentUser = null;

        function log(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            element.className = `result ${type}`;
            element.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            console.log(message);
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('http://localhost:5000/api/users/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    token = data.token;
                    currentUser = data.user;
                    log('loginResult', `✅ Login successful! User: ${data.user.name}`, 'success');
                } else {
                    log('loginResult', `❌ Login failed: ${data.message}`, 'error');
                }
            } catch (error) {
                log('loginResult', `❌ Login error: ${error.message}`, 'error');
            }
        }

        async function getProfile(stage) {
            if (!token) {
                log(`${stage}Profile`, '❌ Please login first', 'error');
                return;
            }
            
            try {
                const response = await fetch('http://localhost:5000/api/user/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    currentUser = data.user;
                    const logoStatus = data.user.logo ? `✅ HAS LOGO: ${data.user.logo}` : '❌ NO LOGO';
                    log(`${stage}Profile`, `Profile retrieved!\n${logoStatus}\nFull data: ${JSON.stringify(data.user, null, 2)}`, 'success');
                } else {
                    log(`${stage}Profile`, `❌ Failed to get profile: ${data.message}`, 'error');
                }
            } catch (error) {
                log(`${stage}Profile`, `❌ Profile error: ${error.message}`, 'error');
            }
        }

        async function simulateLogoUpload() {
            if (!token || !currentUser) {
                log('logoUploadResult', '❌ Please login and get profile first', 'error');
                return;
            }
            
            try {
                const testLogoUrl = 'https://example.com/test-logo-' + Date.now() + '.jpg';
                
                const updateData = {
                    name: currentUser.name,
                    email: currentUser.email,
                    phone: currentUser.phone || '',
                    country: currentUser.country || '',
                    logo: testLogoUrl
                };
                
                log('logoUploadResult', `🚀 Simulating logo upload with URL: ${testLogoUrl}`, 'info');
                
                const response = await fetch('http://localhost:5000/api/user/update-profile', {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(updateData)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    log('logoUploadResult', `✅ Logo upload simulation successful!\nURL: ${testLogoUrl}`, 'success');
                    
                    // Immediately check if it was saved
                    setTimeout(async () => {
                        const checkResponse = await fetch('http://localhost:5000/api/user/me', {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        const checkData = await checkResponse.json();
                        const logoCheck = checkData.user.logo === testLogoUrl ? '✅ LOGO SAVED' : '❌ LOGO NOT SAVED';
                        log('logoUploadResult', `${document.getElementById('logoUploadResult').textContent}\n\nImmediate verification: ${logoCheck}`, 'success');
                    }, 100);
                } else {
                    log('logoUploadResult', `❌ Logo upload failed: ${result.message}`, 'error');
                }
            } catch (error) {
                log('logoUploadResult', `❌ Logo upload error: ${error.message}`, 'error');
            }
        }

        async function simulateProfileSave() {
            if (!token || !currentUser) {
                log('profileSaveResult', '❌ Please login and get profile first', 'error');
                return;
            }
            
            try {
                // Simulate what handleSave does - send formData WITHOUT logo
                const formData = {
                    name: currentUser.name,
                    email: currentUser.email,
                    phone: currentUser.phone || '',
                    country: currentUser.country || ''
                    // Notice: NO logo field - this might overwrite it!
                };
                
                log('profileSaveResult', `🔄 Simulating profile save WITHOUT logo field...`, 'warning');
                
                const response = await fetch('http://localhost:5000/api/user/update-profile', {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    log('profileSaveResult', `✅ Profile save simulation successful!\nData sent: ${JSON.stringify(formData, null, 2)}`, 'warning');
                } else {
                    log('profileSaveResult', `❌ Profile save failed: ${result.message}`, 'error');
                }
            } catch (error) {
                log('profileSaveResult', `❌ Profile save error: ${error.message}`, 'error');
            }
        }

        async function testConcurrentCalls() {
            if (!token || !currentUser) {
                log('concurrentResult', '❌ Please login and get profile first', 'error');
                return;
            }
            
            try {
                log('concurrentResult', '🚀 Testing concurrent profile updates...', 'info');
                
                const testLogoUrl = 'https://example.com/concurrent-test-' + Date.now() + '.jpg';
                
                // Call 1: Update with logo
                const updateWithLogo = fetch('http://localhost:5000/api/user/update-profile', {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: currentUser.name,
                        email: currentUser.email,
                        phone: currentUser.phone || '',
                        country: currentUser.country || '',
                        logo: testLogoUrl
                    })
                });
                
                // Call 2: Update without logo (simulating handleSave)
                const updateWithoutLogo = fetch('http://localhost:5000/api/user/update-profile', {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: currentUser.name,
                        email: currentUser.email,
                        phone: currentUser.phone || '',
                        country: currentUser.country || ''
                        // No logo field
                    })
                });
                
                // Execute both calls simultaneously
                const [result1, result2] = await Promise.all([updateWithLogo, updateWithoutLogo]);
                
                log('concurrentResult', `📊 Concurrent calls completed!\nCall 1 (with logo): ${result1.status}\nCall 2 (without logo): ${result2.status}`, 'info');
                
                // Check final state
                setTimeout(async () => {
                    const checkResponse = await fetch('http://localhost:5000/api/user/me', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const checkData = await checkResponse.json();
                    const finalLogo = checkData.user.logo;
                    const logoStatus = finalLogo ? `✅ Final logo: ${finalLogo}` : '❌ No logo in final state';
                    
                    log('concurrentResult', `${document.getElementById('concurrentResult').textContent}\n\nFinal state: ${logoStatus}`, finalLogo ? 'success' : 'error');
                }, 200);
                
            } catch (error) {
                log('concurrentResult', `❌ Concurrent test error: ${error.message}`, 'error');
            }
        }
    </script>
</body>
</html>

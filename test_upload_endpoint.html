<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Upload Endpoint</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .container {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        input, button {
            margin: 10px 0;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        .result {
            background: white;
            padding: 15px;
            border-radius: 5px;
            margin-top: 10px;
            white-space: pre-wrap;
        }
        .success { border-left: 4px solid green; }
        .error { border-left: 4px solid red; }
    </style>
</head>
<body>
    <h1>🧪 Upload Endpoint Test</h1>
    
    <div class="container">
        <h3>Step 1: Login</h3>
        <input type="email" id="email" placeholder="Email" value="user@example.com">
        <input type="password" id="password" placeholder="Password" value="password123">
        <button onclick="login()">Login</button>
        <div id="loginResult" class="result"></div>
    </div>
    
    <div class="container">
        <h3>Step 2: Test Upload</h3>
        <input type="file" id="fileInput" accept="image/*">
        <button onclick="testUpload()">Test Upload</button>
        <div id="uploadResult" class="result"></div>
    </div>
    
    <div class="container">
        <h3>Step 3: Test Profile Update</h3>
        <input type="text" id="logoUrl" placeholder="Logo URL (from upload)">
        <button onclick="testProfileUpdate()">Update Profile</button>
        <div id="profileResult" class="result"></div>
    </div>
    
    <div class="container">
        <h3>Step 4: Get Profile</h3>
        <button onclick="getProfile()">Get Profile</button>
        <div id="getProfileResult" class="result"></div>
    </div>

    <script>
        let token = '';
        let currentUser = null;

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('http://localhost:5000/api/users/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                const resultDiv = document.getElementById('loginResult');
                
                if (response.ok) {
                    token = data.token;
                    currentUser = data.user;
                    resultDiv.className = 'result success';
                    resultDiv.textContent = `✅ Login successful!\nUser: ${data.user.name}\nToken: ${token.substring(0, 20)}...`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = `❌ Login failed: ${data.message}`;
                }
            } catch (error) {
                document.getElementById('loginResult').className = 'result error';
                document.getElementById('loginResult').textContent = `❌ Error: ${error.message}`;
            }
        }

        async function testUpload() {
            if (!token) {
                alert('Please login first');
                return;
            }
            
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Please select a file');
                return;
            }
            
            try {
                const formData = new FormData();
                formData.append('image', file);
                
                const response = await fetch('http://localhost:5000/api/upload/image', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });
                
                const data = await response.json();
                const resultDiv = document.getElementById('uploadResult');
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = `✅ Upload successful!\nURL: ${data.url}`;
                    document.getElementById('logoUrl').value = data.url;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = `❌ Upload failed: ${data.message}`;
                }
            } catch (error) {
                document.getElementById('uploadResult').className = 'result error';
                document.getElementById('uploadResult').textContent = `❌ Error: ${error.message}`;
            }
        }

        async function testProfileUpdate() {
            if (!token || !currentUser) {
                alert('Please login first');
                return;
            }
            
            const logoUrl = document.getElementById('logoUrl').value;
            
            if (!logoUrl) {
                alert('Please provide a logo URL');
                return;
            }
            
            try {
                const updateData = {
                    name: currentUser.name,
                    email: currentUser.email,
                    phone: currentUser.phone || '',
                    country: currentUser.country || '',
                    logo: logoUrl
                };
                
                console.log('Sending update data:', updateData);
                
                const response = await fetch('http://localhost:5000/api/user/update-profile', {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(updateData)
                });
                
                const data = await response.json();
                const resultDiv = document.getElementById('profileResult');
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = `✅ Profile update successful!\nMessage: ${data.message}`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = `❌ Profile update failed: ${data.message}`;
                }
            } catch (error) {
                document.getElementById('profileResult').className = 'result error';
                document.getElementById('profileResult').textContent = `❌ Error: ${error.message}`;
            }
        }

        async function getProfile() {
            if (!token) {
                alert('Please login first');
                return;
            }
            
            try {
                const response = await fetch('http://localhost:5000/api/user/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                const resultDiv = document.getElementById('getProfileResult');
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = `✅ Profile retrieved!\n${JSON.stringify(data.user, null, 2)}`;
                    
                    if (data.user.logo) {
                        resultDiv.innerHTML += `<br><br><img src="${data.user.logo}" style="max-width: 200px; border: 1px solid #ddd;" alt="Profile Logo">`;
                    }
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = `❌ Failed to get profile: ${data.message}`;
                }
            } catch (error) {
                document.getElementById('getProfileResult').className = 'result error';
                document.getElementById('getProfileResult').textContent = `❌ Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>

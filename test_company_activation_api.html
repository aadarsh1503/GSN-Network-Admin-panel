<!DOCTYPE html>
<html>
<head>
    <title>Test Company Activation API</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 15px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 10px; padding: 10px; border-radius: 3px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        input, select { padding: 8px; margin: 5px; border: 1px solid #ddd; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Test Company Activation API</h1>
        
        <div class="section">
            <h3>1. Login as Admin</h3>
            <input type="email" id="adminEmail" placeholder="Admin Email" value="admin@gmail.com">
            <input type="password" id="adminPassword" placeholder="Admin Password" value="admin123">
            <button onclick="loginAdmin()">Login as Admin</button>
            <div id="loginResult" class="result"></div>
        </div>
        
        <div class="section">
            <h3>2. Get Company Users</h3>
            <button onclick="getCompanyUsers()">Get Company Users</button>
            <div id="companyUsersResult" class="result"></div>
            <select id="companySelect" style="width: 100%; margin-top: 10px;">
                <option value="">Select a company to activate</option>
            </select>
        </div>
        
        <div class="section">
            <h3>3. Activate Company</h3>
            <input type="text" id="activationReason" placeholder="Activation Reason" value="Manual activation test">
            <button onclick="activateCompany()">Activate Selected Company</button>
            <div id="activationResult" class="result"></div>
        </div>
        
        <div class="section">
            <h3>4. Check Email Queue Status</h3>
            <button onclick="checkEmailQueue()">Check Email Queue</button>
            <div id="queueResult" class="result"></div>
        </div>
    </div>

    <script>
        let adminToken = '';
        const API_BASE = 'http://localhost:5000/api';
        
        async function loginAdmin() {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            const resultDiv = document.getElementById('loginResult');
            
            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    adminToken = data.token;
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `✅ Admin login successful!<br>Token: ${adminToken.substring(0, 20)}...`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `❌ Login failed: ${data.message}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `❌ Error: ${error.message}`;
            }
        }
        
        async function getCompanyUsers() {
            const resultDiv = document.getElementById('companyUsersResult');
            const companySelect = document.getElementById('companySelect');
            
            if (!adminToken) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = '❌ Please login as admin first';
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/users/companies`, {
                    headers: { 'Authorization': `Bearer ${adminToken}` }
                });
                
                const companies = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `✅ Found ${companies.length} companies`;
                    
                    // Populate select dropdown
                    companySelect.innerHTML = '<option value="">Select a company to activate</option>';
                    companies.forEach(company => {
                        const option = document.createElement('option');
                        option.value = company.id;
                        option.textContent = `${company.name} (${company.email}) - Status: ${company.status ? 'Active' : 'Pending'}`;
                        companySelect.appendChild(option);
                    });
                    
                    // Show company details
                    const companyList = companies.map(c => 
                        `<div style="margin: 5px 0; padding: 5px; background: #f8f9fa;">
                            ID: ${c.id} | ${c.name} (${c.email}) | Status: ${c.status ? 'Active' : 'Pending'}
                        </div>`
                    ).join('');
                    resultDiv.innerHTML += `<div style="margin-top: 10px;">${companyList}</div>`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `❌ Error: ${companies.message}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `❌ Error: ${error.message}`;
            }
        }
        
        async function activateCompany() {
            const companyId = document.getElementById('companySelect').value;
            const reason = document.getElementById('activationReason').value;
            const resultDiv = document.getElementById('activationResult');
            
            if (!adminToken) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = '❌ Please login as admin first';
                return;
            }
            
            if (!companyId) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = '❌ Please select a company to activate';
                return;
            }
            
            try {
                console.log(`🚀 Activating company ID: ${companyId} with reason: ${reason}`);
                
                const response = await fetch(`${API_BASE}/admin-panel/users/${companyId}/activate`, {
                    method: 'PUT',
                    headers: { 
                        'Authorization': `Bearer ${adminToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ reason })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `✅ Company activated successfully!<br>
                        Message: ${data.message}<br>
                        User: ${data.user.name} (${data.user.email})<br>
                        Status: ${data.user.status}`;
                    
                    // Refresh company list
                    setTimeout(() => getCompanyUsers(), 1000);
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `❌ Activation failed: ${data.message}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `❌ Error: ${error.message}`;
            }
        }
        
        async function checkEmailQueue() {
            const resultDiv = document.getElementById('queueResult');
            
            if (!adminToken) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = '❌ Please login as admin first';
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/email-queue/status`, {
                    headers: { 'Authorization': `Bearer ${adminToken}` }
                });
                
                const queueStatus = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `✅ Email Queue Status:<br>
                        Queue Size: ${queueStatus.queueSize}<br>
                        Processing: ${queueStatus.processing}<br>
                        Pending Emails: ${queueStatus.pendingEmails.length}<br>
                        <pre>${JSON.stringify(queueStatus, null, 2)}</pre>`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `❌ Error: ${queueStatus.message}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `❌ Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>

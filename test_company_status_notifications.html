<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Company Status Notifications</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        button { padding: 10px 15px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .log { background: #f8f9fa; padding: 10px; margin: 10px 0; border-radius: 3px; font-family: monospace; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Test Company Status Notifications</h1>
    <p>This page tests if admin notifications are created when company members update quote status.</p>

    <div class="test-section">
        <h3>Step 1: Login as Company</h3>
        <button onclick="loginAsCompany()">Login as Company</button>
        <div id="loginResult" class="log"></div>
    </div>

    <div class="test-section">
        <h3>Step 2: Get Company Quotes</h3>
        <button onclick="getCompanyQuotes()">Get My Quotes</button>
        <div id="quotesResult" class="log"></div>
    </div>

    <div class="test-section">
        <h3>Step 3: Update Quote Status</h3>
        <input type="number" id="quoteId" placeholder="Quote ID" />
        <select id="newStatus">
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
            <option value="running">Running</option>
            <option value="closed">Closed</option>
        </select>
        <button onclick="updateQuoteStatus()">Update Status</button>
        <div id="updateResult" class="log"></div>
    </div>

    <div class="test-section">
        <h3>Step 4: Check Admin Notifications</h3>
        <button onclick="checkAdminNotifications()">Check Admin Notifications</button>
        <div id="notificationsResult" class="log"></div>
    </div>

    <script>
        let companyToken = '';
        let adminToken = '';

        async function loginAsCompany() {
            const logDiv = document.getElementById('loginResult');
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'company@test.com', // Replace with actual company email
                        password: 'password123'     // Replace with actual password
                    })
                });

                const data = await response.json();
                if (response.ok) {
                    companyToken = data.token;
                    logDiv.textContent = `✅ Company login successful!\nToken: ${companyToken.substring(0, 20)}...`;
                    logDiv.className = 'log success';
                } else {
                    logDiv.textContent = `❌ Company login failed: ${data.message}`;
                    logDiv.className = 'log error';
                }
            } catch (error) {
                logDiv.textContent = `❌ Error: ${error.message}`;
                logDiv.className = 'log error';
            }
        }

        async function getCompanyQuotes() {
            const logDiv = document.getElementById('quotesResult');
            if (!companyToken) {
                logDiv.textContent = '❌ Please login as company first';
                logDiv.className = 'log error';
                return;
            }

            try {
                const response = await fetch('/api/company-quotes/my-responses', {
                    headers: {
                        'Authorization': `Bearer ${companyToken}`
                    }
                });

                const data = await response.json();
                if (response.ok) {
                    logDiv.textContent = `✅ Found ${data.length} quote responses:\n${JSON.stringify(data.slice(0, 3), null, 2)}`;
                    logDiv.className = 'log success';
                } else {
                    logDiv.textContent = `❌ Failed to get quotes: ${data.message}`;
                    logDiv.className = 'log error';
                }
            } catch (error) {
                logDiv.textContent = `❌ Error: ${error.message}`;
                logDiv.className = 'log error';
            }
        }

        async function updateQuoteStatus() {
            const logDiv = document.getElementById('updateResult');
            const quoteId = document.getElementById('quoteId').value;
            const status = document.getElementById('newStatus').value;

            if (!companyToken) {
                logDiv.textContent = '❌ Please login as company first';
                logDiv.className = 'log error';
                return;
            }

            if (!quoteId) {
                logDiv.textContent = '❌ Please enter a quote ID';
                logDiv.className = 'log error';
                return;
            }

            try {
                const response = await fetch(`/api/company-quotes/quote/${quoteId}/status`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${companyToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status })
                });

                const data = await response.json();
                if (response.ok) {
                    logDiv.textContent = `✅ Quote status updated successfully!\nQuote ID: ${quoteId}\nNew Status: ${status}\nResponse: ${data.message}`;
                    logDiv.className = 'log success';
                } else {
                    logDiv.textContent = `❌ Failed to update status: ${data.message}`;
                    logDiv.className = 'log error';
                }
            } catch (error) {
                logDiv.textContent = `❌ Error: ${error.message}`;
                logDiv.className = 'log error';
            }
        }

        async function checkAdminNotifications() {
            const logDiv = document.getElementById('notificationsResult');
            
            // First login as admin
            try {
                const loginResponse = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'admin@gmail.com',
                        password: 'admin123'
                    })
                });

                const loginData = await loginResponse.json();
                if (!loginResponse.ok) {
                    logDiv.textContent = `❌ Admin login failed: ${loginData.message}`;
                    logDiv.className = 'log error';
                    return;
                }

                adminToken = loginData.token;

                // Now get admin notifications
                const notificationsResponse = await fetch('/api/admin/pending-notifications', {
                    headers: {
                        'Authorization': `Bearer ${adminToken}`
                    }
                });

                const notifications = await notificationsResponse.json();
                if (notificationsResponse.ok) {
                    const recentNotifications = notifications.filter(n => {
                        const notificationTime = new Date(n.created_at);
                        const fiveMinutesAgo = new Date(Date.now() - 5 * 60 * 1000);
                        return notificationTime > fiveMinutesAgo;
                    });

                    logDiv.textContent = `✅ Admin notifications check complete!\nTotal notifications: ${notifications.length}\nRecent notifications (last 5 min): ${recentNotifications.length}\n\nRecent notifications:\n${JSON.stringify(recentNotifications, null, 2)}`;
                    logDiv.className = 'log success';
                } else {
                    logDiv.textContent = `❌ Failed to get admin notifications: ${notifications.message}`;
                    logDiv.className = 'log error';
                }
            } catch (error) {
                logDiv.textContent = `❌ Error: ${error.message}`;
                logDiv.className = 'log error';
            }
        }
    </script>
</body>
</html>

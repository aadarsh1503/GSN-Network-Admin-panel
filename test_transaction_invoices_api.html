<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Transaction Invoices API</title>
</head>
<body>
    <h1>Test Transaction Invoices API</h1>
    <div id="results"></div>

    <script>
        async function testAPI() {
            const results = document.getElementById('results');
            
            try {
                // Test business transaction invoices endpoint
                console.log('Testing business transaction invoices API...');
                
                const response = await fetch('http://localhost:5000/api/business/transaction-invoices', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        // You'll need to add a valid business token here
                        'Authorization': 'Bearer YOUR_BUSINESS_TOKEN_HERE'
                    }
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('Success! Data:', data);
                    results.innerHTML = `<h2>✅ Success!</h2><pre>${JSON.stringify(data, null, 2)}</pre>`;
                } else {
                    const errorText = await response.text();
                    console.log('Error response:', errorText);
                    results.innerHTML = `<h2>❌ Error ${response.status}</h2><pre>${errorText}</pre>`;
                }
                
            } catch (error) {
                console.error('Network error:', error);
                results.innerHTML = `<h2>❌ Network Error</h2><pre>${error.message}</pre>`;
            }
        }
        
        // Test when page loads
        testAPI();
    </script>
</body>
</html>

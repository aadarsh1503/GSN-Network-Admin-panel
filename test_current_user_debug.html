<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Current User</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .result { margin: 10px 0; padding: 10px; border: 1px solid #ccc; background: #f9f9f9; }
        .error { background: #ffebee; border-color: #f44336; }
        .success { background: #e8f5e8; border-color: #4caf50; }
        button { padding: 10px 20px; margin: 5px; background: #2196f3; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Debug Current User & Transaction Invoices</h1>
    
    <button onclick="checkCurrentUser()">Check Current User</button>
    <button onclick="testTransactionInvoicesAPI()">Test Transaction Invoices API</button>
    <button onclick="checkDatabaseDirectly()">Check Database Directly</button>
    
    <div id="results"></div>

    <script>
        const results = document.getElementById('results');
        
        function addResult(message, isError = false) {
            const div = document.createElement('div');
            div.className = `result ${isError ? 'error' : 'success'}`;
            div.innerHTML = message;
            results.appendChild(div);
        }
        
        async function checkCurrentUser() {
            try {
                const token = localStorage.getItem('token');
                if (!token) {
                    addResult('❌ No token found in localStorage. Please login first.', true);
                    return;
                }
                
                addResult(`🔑 Token found: ${token.substring(0, 20)}...`);
                
                const response = await fetch('http://localhost:5000/api/users/me', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const user = await response.json();
                    addResult(`👤 Current User: ${JSON.stringify(user, null, 2)}`);
                } else {
                    const error = await response.text();
                    addResult(`❌ Error getting user: ${error}`, true);
                }
            } catch (error) {
                addResult(`❌ Network error: ${error.message}`, true);
            }
        }
        
        async function testTransactionInvoicesAPI() {
            try {
                const token = localStorage.getItem('token');
                if (!token) {
                    addResult('❌ No token found. Please login first.', true);
                    return;
                }
                
                addResult('🔍 Testing transaction invoices API...');
                
                const response = await fetch('http://localhost:5000/api/business/transaction-invoices', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                addResult(`📊 API Response Status: ${response.status}`);
                
                if (response.ok) {
                    const data = await response.json();
                    addResult(`✅ API Success: ${JSON.stringify(data, null, 2)}`);
                } else {
                    const error = await response.text();
                    addResult(`❌ API Error: ${error}`, true);
                }
            } catch (error) {
                addResult(`❌ Network error: ${error.message}`, true);
            }
        }
        
        async function checkDatabaseDirectly() {
            addResult('📋 Database check: We created 6 invoices for user ID 44 (subodhchauhan1309@gmail.com)');
            addResult('📋 These invoices should be visible to company ID 10 (Aadarsh-company)');
            addResult('📋 Make sure you are logged in as the company user, not the business user!');
            addResult('📋 The business user (subodhchauhan1309@gmail.com) should see invoices in USER panel, not business panel');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Company Profile API</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 20px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .header { 
            text-align: center; 
            margin-bottom: 30px;
            color: #333;
        }
        .profile-card { 
            border: 2px solid #2196f3; 
            padding: 25px; 
            margin: 20px 0; 
            border-radius: 15px; 
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.2);
        }
        .profile-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
            padding: 10px;
            background: white;
            border-radius: 8px;
            border: 1px solid #2196f3;
        }
        .icon {
            width: 20px;
            height: 20px;
            background: #2196f3;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
        }
        .error { 
            color: #f44336; 
            font-weight: bold; 
            background: #ffebee;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #f44336;
        }
        .success { 
            color: #4caf50; 
            font-weight: bold; 
            background: #e8f5e8;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #4caf50;
        }
        .warning { 
            color: #ff9800; 
            font-weight: bold; 
            background: #fff3e0;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ff9800;
        }
        button { 
            padding: 12px 25px; 
            margin: 10px; 
            cursor: pointer; 
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .btn-primary { 
            background: linear-gradient(135deg, #2196f3, #1976d2); 
            color: white; 
        }
        .btn-primary:hover { 
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.4);
        }
        .btn-secondary { 
            background: linear-gradient(135deg, #6c757d, #495057); 
            color: white; 
        }
        .btn-secondary:hover { 
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(108, 117, 125, 0.4);
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #2196f3;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏢 Company Profile API Test</h1>
            <p>Testing the new company profile endpoint: <code>/api/user/company-profile</code></p>
        </div>
        
        <div style="text-align: center;">
            <button class="btn-primary" onclick="testCompanyProfile()">
                🔍 Test Company Profile API
            </button>
            <button class="btn-secondary" onclick="clearResults()">
                🗑️ Clear Results
            </button>
        </div>
        
        <div id="results"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000';
        
        async function testCompanyProfile() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div style="text-align: center; padding: 20px;"><div class="loading"></div> Testing company profile API...</div>';
            
            try {
                // Get token from localStorage (assuming company is logged in)
                const token = localStorage.getItem('token');
                if (!token) {
                    resultsDiv.innerHTML = '<div class="error">❌ No authentication token found. Please log in as a company first.</div>';
                    return;
                }
                
                console.log('Making API call to:', `${API_BASE}/api/user/company-profile`);
                
                const response = await fetch(`${API_BASE}/api/user/company-profile`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('Error response:', errorText);
                    throw new Error(`HTTP error! status: ${response.status} - ${errorText}`);
                }
                
                const profile = await response.json();
                console.log('Profile data:', profile);
                
                if (!profile) {
                    resultsDiv.innerHTML = '<div class="warning">⚠️ API returned empty profile data.</div>';
                    return;
                }
                
                let html = '<div class="success">✅ Company Profile API Working Successfully!</div>';
                
                html += `
                    <div class="profile-card">
                        <h3 style="color: #1976d2; margin-bottom: 20px; text-align: center;">
                            🏢 Your Company Profile
                        </h3>
                        
                        ${profile.name ? `
                            <div class="profile-item">
                                <div class="icon">👤</div>
                                <div>
                                    <strong>Company Name:</strong> ${profile.name}
                                </div>
                            </div>
                        ` : '<div class="warning">⚠️ Company name not available</div>'}
                        
                        ${profile.email ? `
                            <div class="profile-item">
                                <div class="icon">📧</div>
                                <div>
                                    <strong>Email:</strong> ${profile.email}
                                </div>
                            </div>
                        ` : '<div class="warning">⚠️ Company email not available</div>'}
                        
                        ${profile.phone ? `
                            <div class="profile-item">
                                <div class="icon">📞</div>
                                <div>
                                    <strong>Phone:</strong> ${profile.phone}
                                </div>
                            </div>
                        ` : '<div class="warning">⚠️ Company phone not available</div>'}
                        
                        ${profile.role ? `
                            <div class="profile-item">
                                <div class="icon">🏷️</div>
                                <div>
                                    <strong>Role:</strong> ${profile.role}
                                </div>
                            </div>
                        ` : ''}
                        
                        ${profile.status !== undefined ? `
                            <div class="profile-item">
                                <div class="icon">${profile.status ? '✅' : '❌'}</div>
                                <div>
                                    <strong>Status:</strong> ${profile.status ? 'Active' : 'Inactive'}
                                </div>
                            </div>
                        ` : ''}
                        
                        ${profile.created_at ? `
                            <div class="profile-item">
                                <div class="icon">📅</div>
                                <div>
                                    <strong>Created:</strong> ${new Date(profile.created_at).toLocaleDateString()}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
                
                html += `
                    <div style="margin-top: 20px; padding: 15px; background: #f5f5f5; border-radius: 8px;">
                        <h4>🔧 Technical Details:</h4>
                        <p><strong>API Endpoint:</strong> GET /api/user/company-profile</p>
                        <p><strong>Response Status:</strong> ${response.status}</p>
                        <p><strong>Company ID:</strong> ${profile.id}</p>
                        <p><strong>Data Complete:</strong> ${profile.name && profile.email ? '✅ Yes' : '⚠️ Partial'}</p>
                    </div>
                `;
                
                resultsDiv.innerHTML = html;
                
            } catch (error) {
                console.error('Error testing company profile:', error);
                resultsDiv.innerHTML = `
                    <div class="error">
                        ❌ <strong>Error:</strong> ${error.message}
                        <br><br>
                        <strong>Possible causes:</strong>
                        <ul style="margin-top: 10px;">
                            <li>Not logged in as a company user</li>
                            <li>Server is not running</li>
                            <li>API endpoint not properly configured</li>
                            <li>Authentication token expired</li>
                        </ul>
                    </div>
                `;
            }
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        // Auto-test on page load if token exists
        window.onload = function() {
            const token = localStorage.getItem('token');
            if (token) {
                console.log('Token found, auto-testing...');
                testCompanyProfile();
            } else {
                document.getElementById('results').innerHTML = '<div class="error">❌ Please log in as a company first to test this API.</div>';
            }
        };
    </script>
</body>
</html>

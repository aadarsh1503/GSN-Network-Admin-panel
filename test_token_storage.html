<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Storage Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background-color: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .info { background-color: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 5px; overflow-x: auto; }
        button { padding: 10px 20px; margin: 5px; border: none; border-radius: 5px; cursor: pointer; background-color: #007bff; color: white; }
    </style>
</head>
<body>
    <h1>🔍 Token Storage Test</h1>
    
    <div class="result info">
        <h3>Test Steps</h3>
        <p>1. Login to your application in another tab</p>
        <p>2. Come back to this tab and click "Check Token"</p>
        <p>3. If token exists, click "Test API Call"</p>
    </div>
    
    <button onclick="checkToken()">🔍 Check Token</button>
    <button onclick="testApiCall()">🧪 Test API Call</button>
    <button onclick="simulateLogin()">🔐 Simulate Login</button>
    <button onclick="clearStorage()">🗑️ Clear Storage</button>
    
    <div id="results"></div>

    <script>
        function addResult(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = message;
            results.appendChild(div);
        }

        function checkToken() {
            addResult('<h3>🔍 Checking Token Storage</h3>');
            
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');
            
            addResult(`Token exists: ${token ? '✅ YES' : '❌ NO'}`, token ? 'success' : 'error');
            addResult(`User data exists: ${user ? '✅ YES' : '❌ NO'}`, user ? 'success' : 'error');
            
            if (token) {
                addResult(`Token length: ${token.length}`, 'info');
                addResult(`Token preview: ${token.substring(0, 100)}...`, 'info');
                
                // Check if it's a valid JWT format
                const parts = token.split('.');
                if (parts.length === 3) {
                    addResult('✅ Token has valid JWT format (3 parts)', 'success');
                    
                    try {
                        const payload = JSON.parse(atob(parts[1]));
                        const currentTime = Date.now() / 1000;
                        const isExpired = payload.exp < currentTime;
                        
                        addResult(`<pre>Token Payload:
User ID: ${payload.id}
Email: ${payload.email}
Role: ${payload.role}
Expires: ${new Date(payload.exp * 1000).toLocaleString()}
Is Expired: ${isExpired ? '❌ YES' : '✅ NO'}</pre>`, isExpired ? 'error' : 'success');
                        
                    } catch (error) {
                        addResult(`❌ Error decoding token payload: ${error.message}`, 'error');
                    }
                } else {
                    addResult('❌ Token does not have valid JWT format', 'error');
                }
            }
            
            if (user) {
                try {
                    const userData = JSON.parse(user);
                    addResult(`<pre>User Data:
${JSON.stringify(userData, null, 2)}</pre>`, 'info');
                } catch (error) {
                    addResult(`❌ Error parsing user data: ${error.message}`, 'error');
                }
            }
        }

        async function testApiCall() {
            addResult('<h3>🧪 Testing API Call</h3>');
            
            const token = localStorage.getItem('token');
            
            if (!token) {
                addResult('❌ No token found for testing', 'error');
                return;
            }
            
            // Log the exact headers being sent
            const headers = {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json',
                'Cache-Control': 'no-cache, no-store, must-revalidate',
                'Pragma': 'no-cache',
                'Expires': '0'
            };
            
            addResult(`<h4>Request Headers:</h4><pre>${JSON.stringify(headers, null, 2)}</pre>`, 'info');
            
            try {
                const response = await fetch('http://localhost:5000/api/quotes/available', {
                    method: 'GET',
                    headers: headers
                });
                
                addResult(`Response Status: ${response.status} ${response.statusText}`, 
                    response.ok ? 'success' : 'error');
                
                if (response.ok) {
                    const data = await response.json();
                    addResult(`✅ Success! Got ${data.quotes?.length || 0} quotes`, 'success');
                } else {
                    const errorText = await response.text();
                    addResult(`❌ Error Response: ${errorText}`, 'error');
                }
                
            } catch (error) {
                addResult(`❌ Network Error: ${error.message}`, 'error');
            }
        }

        async function simulateLogin() {
            addResult('<h3>🔐 Simulating Login</h3>');
            
            const credentials = {
                email: 'aadarshchauhan35@gmail.com',
                password: 'password123'
            };
            
            try {
                const response = await fetch('http://localhost:5000/api/user/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(credentials)
                });
                
                if (response.ok) {
                    const data = await response.json();
                    
                    // Store token exactly like the real login does
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    addResult('✅ Login successful! Token stored.', 'success');
                    addResult(`Token: ${data.token.substring(0, 50)}...`, 'info');
                    
                    // Immediately test the API call
                    setTimeout(testApiCall, 500);
                    
                } else {
                    const errorData = await response.json();
                    addResult(`❌ Login failed: ${errorData.message}`, 'error');
                }
                
            } catch (error) {
                addResult(`❌ Login error: ${error.message}`, 'error');
            }
        }

        function clearStorage() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            addResult('🗑️ Storage cleared', 'info');
        }

        // Check immediately on page load
        window.onload = function() {
            setTimeout(checkToken, 100);
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Admin Bank Details API</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; padding: 15px; border-radius: 4px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .info { background: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test Admin Bank Details API</h1>
        
        <div class="info">
            <h3>Instructions:</h3>
            <p>1. First, login as admin to get the token</p>
            <p>2. Then test creating bank details</p>
            <p>3. Check the console for detailed logs</p>
        </div>

        <h2>1. Admin Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="loginEmail" value="admin@gmail.com" required>
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="loginPassword" value="admin123" required>
            </div>
            <button type="submit">Login as Admin</button>
        </form>

        <h2>2. Create Bank Details</h2>
        <form id="bankDetailsForm">
            <div class="form-group">
                <label>Bank Name:</label>
                <input type="text" id="bankName" value="Test Bank" required>
            </div>
            <div class="form-group">
                <label>Branch Name:</label>
                <input type="text" id="branchName" value="Test Branch" required>
            </div>
            <div class="form-group">
                <label>Account Holder Name:</label>
                <input type="text" id="accountHolderName" value="GSN Network Services" required>
            </div>
            <div class="form-group">
                <label>Account Number:</label>
                <input type="text" id="accountNumber" value="1234567890123456" required>
            </div>
            <div class="form-group">
                <label>IBAN Number:</label>
                <input type="text" id="ibanNumber" value="GB29 NWBK 6016 1331 9268 19" required>
            </div>
            <div class="form-group">
                <label>SWIFT Code:</label>
                <input type="text" id="swiftCode" value="SBININBB123" required>
            </div>
            <div class="form-group">
                <label>Payment Instructions:</label>
                <textarea id="paymentInstructions" rows="3">Please ensure to enter the correct reference number when making payment.</textarea>
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" id="isActive" checked> Set as Active
                </label>
            </div>
            <button type="submit">Create Bank Details</button>
        </form>

        <h2>3. Get All Bank Details</h2>
        <button id="getAllBtn">Get All Admin Bank Details</button>

        <div id="result"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000';
        let authToken = '';

        function showResult(message, type = 'info') {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `<div class="${type}">${message}</div>`;
            console.log(`[${type.toUpperCase()}]`, message);
        }

        // Login form handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            try {
                showResult('Attempting admin login...', 'info');
                
                const response = await fetch(`${API_BASE}/api/user/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                console.log('Login response:', data);
                
                if (response.ok && data.token) {
                    authToken = data.token;
                    showResult(`✅ Login successful! Role: ${data.user?.role || 'Unknown'}`, 'success');
                } else {
                    showResult(`❌ Login failed: ${data.message || 'Unknown error'}`, 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                showResult(`❌ Login error: ${error.message}`, 'error');
            }
        });

        // Bank details form handler
        document.getElementById('bankDetailsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!authToken) {
                showResult('❌ Please login first!', 'error');
                return;
            }
            
            const formData = {
                bank_name: document.getElementById('bankName').value,
                branch_name: document.getElementById('branchName').value,
                account_holder_name: document.getElementById('accountHolderName').value,
                account_number: document.getElementById('accountNumber').value,
                iban_number: document.getElementById('ibanNumber').value,
                swift_code: document.getElementById('swiftCode').value,
                payment_instructions: document.getElementById('paymentInstructions').value,
                is_active: document.getElementById('isActive').checked
            };
            
            try {
                showResult('Creating bank details...', 'info');
                console.log('Sending data:', formData);
                
                const response = await fetch(`${API_BASE}/api/bank-details/admin`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                console.log('Create response:', data);
                
                if (response.ok) {
                    showResult(`✅ Bank details created successfully! ID: ${data.id}`, 'success');
                } else {
                    showResult(`❌ Failed to create bank details: ${data.message || 'Unknown error'}`, 'error');
                }
            } catch (error) {
                console.error('Create error:', error);
                showResult(`❌ Create error: ${error.message}`, 'error');
            }
        });

        // Get all bank details
        document.getElementById('getAllBtn').addEventListener('click', async () => {
            if (!authToken) {
                showResult('❌ Please login first!', 'error');
                return;
            }
            
            try {
                showResult('Fetching all bank details...', 'info');
                
                const response = await fetch(`${API_BASE}/api/bank-details/admin/all`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });
                
                const data = await response.json();
                console.log('Get all response:', data);
                
                if (response.ok) {
                    let message = `✅ Found ${data.length} bank details:<br><br>`;
                    data.forEach(bank => {
                        message += `<strong>ID:</strong> ${bank.id}<br>`;
                        message += `<strong>Bank:</strong> ${bank.bank_name} - ${bank.branch_name}<br>`;
                        message += `<strong>Account:</strong> ${bank.account_holder_name} (${bank.account_number})<br>`;
                        message += `<strong>IBAN:</strong> ${bank.iban_number || 'Not set'}<br>`;
                        message += `<strong>SWIFT:</strong> ${bank.swift_code || 'Not set'}<br>`;
                        message += `<strong>Active:</strong> ${bank.is_active ? 'Yes' : 'No'}<br><br>`;
                    });
                    showResult(message, 'success');
                } else {
                    showResult(`❌ Failed to fetch bank details: ${data.message || 'Unknown error'}`, 'error');
                }
            } catch (error) {
                console.error('Fetch error:', error);
                showResult(`❌ Fetch error: ${error.message}`, 'error');
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Quick Login Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { padding: 10px 20px; margin: 10px; cursor: pointer; }
        .result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Quick Login Test</h1>
    
    <button onclick="loginBusiness()">Login as Business User</button>
    <button onclick="testDisputes()">Test Disputes API</button>
    <button onclick="testFileUpload()">Test File Upload</button>
    <button onclick="clearAuth()">Clear Auth</button>
    
    <div id="results"></div>
    
    <input type="file" id="fileInput" accept="image/*" style="margin: 10px 0;">
    
    <script>
        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = 'result ' + type;
            div.innerHTML = '<strong>' + new Date().toLocaleTimeString() + '</strong>: ' + message;
            document.getElementById('results').appendChild(div);
            console.log(message);
        }
        
        async function loginBusiness() {
            try {
                addResult('Logging in as business user...', 'info');
                
                const response = await fetch('http://localhost:5000/api/user/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'a@gmail.com',
                        password: '222333'
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    
                    // Store in localStorage
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    addResult('✅ Login successful! User: ' + data.user.name + ' (' + data.user.role + ')', 'success');
                } else {
                    const errorData = await response.json();
                    addResult('❌ Login failed: ' + errorData.message, 'error');
                }
            } catch (error) {
                addResult('❌ Login error: ' + error.message, 'error');
            }
        }
        
        async function testDisputes() {
            const token = localStorage.getItem('token');
            if (!token) {
                addResult('❌ Please login first', 'error');
                return;
            }
            
            try {
                addResult('Testing disputes API...', 'info');
                
                const response = await fetch('http://localhost:5000/api/disputes/my-disputes', {
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    addResult('✅ Disputes API works! Found ' + data.length + ' disputes', 'success');
                } else {
                    const errorData = await response.json();
                    addResult('❌ Disputes API failed: ' + errorData.message, 'error');
                }
            } catch (error) {
                addResult('❌ Disputes API error: ' + error.message, 'error');
            }
        }
        
        async function testFileUpload() {
            const token = localStorage.getItem('token');
            const fileInput = document.getElementById('fileInput');
            
            if (!token) {
                addResult('❌ Please login first', 'error');
                return;
            }
            
            if (!fileInput.files[0]) {
                addResult('❌ Please select a file first', 'error');
                return;
            }
            
            try {
                addResult('Testing file upload...', 'info');
                
                const formData = new FormData();
                formData.append('image', fileInput.files[0]);
                
                const response = await fetch('http://localhost:5000/api/upload/image', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + token
                    },
                    body: formData
                });
                
                if (response.ok) {
                    const data = await response.json();
                    addResult('✅ File upload works! URL: ' + data.url, 'success');
                } else {
                    const errorData = await response.json();
                    addResult('❌ File upload failed: ' + errorData.message, 'error');
                }
            } catch (error) {
                addResult('❌ File upload error: ' + error.message, 'error');
            }
        }
        
        function clearAuth() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            addResult('✅ Authentication cleared', 'success');
        }
        
        // Check current auth status on load
        window.onload = function() {
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');
            
            if (token && user) {
                const userData = JSON.parse(user);
                addResult('Current user: ' + userData.name + ' (' + userData.role + ')', 'info');
            } else {
                addResult('No user logged in', 'info');
            }
        };
    </script>
</body>
</html>

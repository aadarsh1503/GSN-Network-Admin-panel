<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSE Connection Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .connected { background-color: #d4edda; color: #155724; }
        .disconnected { background-color: #f8d7da; color: #721c24; }
        .log { background-color: #f8f9fa; padding: 10px; border: 1px solid #dee2e6; border-radius: 5px; height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>SSE Connection Test</h1>
    <div id="status" class="status disconnected">Disconnected</div>
    <button onclick="connect()">Connect</button>
    <button onclick="disconnect()">Disconnect</button>
    <h3>Log:</h3>
    <div id="log" class="log"></div>

    <script>
        let eventSource = null;
        const statusDiv = document.getElementById('status');
        const logDiv = document.getElementById('log');

        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${timestamp}] ${message}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateStatus(connected) {
            if (connected) {
                statusDiv.textContent = 'Connected';
                statusDiv.className = 'status connected';
            } else {
                statusDiv.textContent = 'Disconnected';
                statusDiv.className = 'status disconnected';
            }
        }

        function connect() {
            if (eventSource) {
                eventSource.close();
            }

            // Use a dummy token for testing
            const testToken = 'test-token-for-connection-test';
            
            log('Attempting to connect to SSE...');
            eventSource = new EventSource(`/api/notifications/stream?token=${testToken}`);

            eventSource.onopen = function(event) {
                log('✅ SSE connection opened');
                updateStatus(true);
            };

            eventSource.onmessage = function(event) {
                log(`📨 Received: ${event.data}`);
            };

            eventSource.onerror = function(event) {
                log(`❌ SSE error: ${event.type}`);
                updateStatus(false);
                
                // Log more details about the error
                if (eventSource.readyState === EventSource.CONNECTING) {
                    log('🔄 Reconnecting...');
                } else if (eventSource.readyState === EventSource.CLOSED) {
                    log('🔒 Connection closed');
                }
            };
        }

        function disconnect() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
                log('🔌 Disconnected manually');
                updateStatus(false);
            }
        }

        // Auto-connect on page load
        window.onload = function() {
            log('Page loaded. Click Connect to test SSE connection.');
        };
    </script>
</body>
</html>

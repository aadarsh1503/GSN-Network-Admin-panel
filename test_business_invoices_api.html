<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Business Invoices API</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 10px 0; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Test Business Invoices API</h1>
    
    <div>
        <h3>Login as Business User</h3>
        <input type="email" id="email" placeholder="Email" value="subodhchauhan1309@gmail.com">
        <input type="password" id="password" placeholder="Password" value="222333">
        <button onclick="login()">Login</button>
    </div>
    
    <div>
        <h3>Test Business Transaction Invoices</h3>
        <button onclick="testBusinessInvoices()">Get Business Transaction Invoices</button>
    </div>
    
    <div id="results"></div>

    <script>
        let authToken = localStorage.getItem('token');
        
        function addResult(title, content, isError = false) {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `result ${isError ? 'error' : 'success'}`;
            div.innerHTML = `<h4>${title}</h4><pre>${content}</pre>`;
            results.appendChild(div);
        }
        
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    authToken = data.token;
                    localStorage.setItem('token', authToken);
                    addResult('Login Success', `Token: ${authToken.substring(0, 50)}...
User: ${JSON.stringify(data.user, null, 2)}`);
                } else {
                    addResult('Login Failed', JSON.stringify(data, null, 2), true);
                }
            } catch (error) {
                addResult('Login Error', error.message, true);
            }
        }
        
        async function testBusinessInvoices() {
            if (!authToken) {
                addResult('Error', 'Please login first', true);
                return;
            }
            
            try {
                console.log('🔍 Testing business invoices API...');
                console.log('🔍 Using token:', authToken.substring(0, 50) + '...');
                
                const response = await fetch('http://localhost:5000/api/business/transaction-invoices', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                console.log('📊 Response status:', response.status);
                console.log('📊 Response headers:', response.headers);
                
                const data = await response.json();
                console.log('📊 Response data:', data);
                
                if (response.ok) {
                    addResult('Business Invoices Success', `Status: ${response.status}
Count: ${Array.isArray(data) ? data.length : 'Not an array'}
Data: ${JSON.stringify(data, null, 2)}`);
                } else {
                    addResult('Business Invoices Failed', `Status: ${response.status}
Error: ${JSON.stringify(data, null, 2)}`, true);
                }
            } catch (error) {
                console.error('❌ Error:', error);
                addResult('Business Invoices Error', error.message, true);
            }
        }
        
        // Auto-login if token exists
        if (authToken) {
            addResult('Token Found', `Using existing token: ${authToken.substring(0, 50)}...`);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Member Quotes Authentication</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .error { background-color: #ffebee; border-color: #f44336; }
        .success { background-color: #e8f5e8; border-color: #4caf50; }
        .info { background-color: #e3f2fd; border-color: #2196f3; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 3px; overflow-x: auto; }
        .token-preview { font-family: monospace; font-size: 12px; word-break: break-all; }
    </style>
</head>
<body>
    <h1>🔍 Member Quotes Authentication Debug</h1>
    
    <div class="section info">
        <h3>Current Authentication Status</h3>
        <div id="auth-status">Loading...</div>
    </div>
    
    <div class="section">
        <h3>Quick Actions</h3>
        <button onclick="checkAuth()">🔄 Refresh Auth Status</button>
        <button onclick="testApiCall()">🧪 Test API Call</button>
        <button onclick="clearAuth()">🗑️ Clear Auth</button>
        <button onclick="quickLogin()">🚀 Quick Login (Company)</button>
    </div>
    
    <div class="section">
        <h3>Test Results</h3>
        <div id="test-results">No tests run yet</div>
    </div>
    
    <div class="section">
        <h3>Quick Login Form</h3>
        <input type="email" id="email" placeholder="Email" value="a@gmail.com" style="width: 200px; padding: 5px;">
        <input type="password" id="password" placeholder="Password" value="222333" style="width: 200px; padding: 5px;">
        <button onclick="customLogin()">Login</button>
    </div>

    <script>
        function log(message, type = 'info') {
            const resultsDiv = document.getElementById('test-results');
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? 'red' : type === 'success' ? 'green' : 'blue';
            resultsDiv.innerHTML += `<div style="color: ${color}; margin: 5px 0;">[${timestamp}] ${message}</div>`;
            console.log(message);
        }

        function checkAuth() {
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');
            
            let authHtml = '<div>';
            authHtml += `<p><strong>Token exists:</strong> ${!!token ? '✅ Yes' : '❌ No'}</p>`;
            
            if (token) {
                authHtml += `<p><strong>Token preview:</strong> <span class="token-preview">${token.substring(0, 100)}...</span></p>`;
                
                try {
                    const payload = JSON.parse(atob(token.split('.')[1]));
                    const currentTime = Date.now() / 1000;
                    const isExpired = payload.exp < currentTime;
                    
                    authHtml += `<p><strong>Token expires:</strong> ${new Date(payload.exp * 1000).toLocaleString()}</p>`;
                    authHtml += `<p><strong>Is expired:</strong> ${isExpired ? '❌ Yes' : '✅ No'}</p>`;
                    authHtml += `<p><strong>Token payload:</strong> <pre>${JSON.stringify(payload, null, 2)}</pre></p>`;
                } catch (e) {
                    authHtml += `<p><strong>Token parse error:</strong> ${e.message}</p>`;
                }
            }
            
            authHtml += `<p><strong>User data exists:</strong> ${!!user ? '✅ Yes' : '❌ No'}</p>`;
            
            if (user) {
                try {
                    const userData = JSON.parse(user);
                    authHtml += `<p><strong>User data:</strong> <pre>${JSON.stringify(userData, null, 2)}</pre></p>`;
                } catch (e) {
                    authHtml += `<p><strong>User parse error:</strong> ${e.message}</p>`;
                }
            }
            
            authHtml += '</div>';
            document.getElementById('auth-status').innerHTML = authHtml;
            
            log('Authentication status refreshed');
        }

        async function testApiCall() {
            log('🧪 Testing API call to /api/quotes/available...');
            
            const token = localStorage.getItem('token');
            
            try {
                const response = await fetch('http://localhost:5000/api/quotes/available', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        ...(token && { 'Authorization': `Bearer ${token}` })
                    }
                });
                
                log(`📡 Response status: ${response.status}`);
                
                if (response.ok) {
                    const data = await response.json();
                    log(`✅ Success! Received ${data.quotes?.length || 0} quotes`, 'success');
                    log(`📋 Data: ${JSON.stringify(data, null, 2)}`);
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    log(`❌ Error: ${JSON.stringify(errorData, null, 2)}`, 'error');
                }
            } catch (error) {
                log(`❌ Network error: ${error.message}`, 'error');
            }
        }

        function clearAuth() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            log('🗑️ Authentication cleared', 'success');
            checkAuth();
        }

        async function quickLogin() {
            await customLogin('a@gmail.com', '222333');
        }

        async function customLogin(email = null, password = null) {
            const emailValue = email || document.getElementById('email').value;
            const passwordValue = password || document.getElementById('password').value;
            
            log(`🚀 Attempting login with ${emailValue}...`);
            
            try {
                const response = await fetch('http://localhost:5000/api/user/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: emailValue,
                        password: passwordValue
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    log(`✅ Login successful! User: ${data.user.name} (${data.user.role})`, 'success');
                    checkAuth();
                } else {
                    const errorData = await response.json();
                    log(`❌ Login failed: ${errorData.message}`, 'error');
                }
            } catch (error) {
                log(`❌ Login error: ${error.message}`, 'error');
            }
        }

        // Initialize
        checkAuth();
    </script>
</body>
</html>
